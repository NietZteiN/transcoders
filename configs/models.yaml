# Model panel — reused from Papers 2–3 so feature/attention measures plug into the
# existing accuracy / ISF / HCI tables. Referenced by key from experiment configs.
#
# `revision` is null until the weights are first downloaded — then PIN the resolved
# commit hash here (do NOT invent one). `has_dictionary` records whether a *pretrained*
# SAE/transcoder exists (the feasibility crux, ../CLAUDE.md §1); details in dictionaries.yaml.
# hf_id values are the canonical repo ids; confirm base-vs-instruct per model before a run.

models:
